name: pages
# Publishes the sample HTML report generated from docs/sample-report.json.
# HTML is built in CI so it cannot drift from the committed JSON.
# Repo settings: Settings → Pages → Source = GitHub Actions.
# Public URL: https://codergeeta.github.io/threejs-doctor/
# Sample: https://codergeeta.github.io/threejs-doctor/sample-report.html
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: Generate sample report HTML from committed JSON
        run: node scripts/build-sample-report.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
