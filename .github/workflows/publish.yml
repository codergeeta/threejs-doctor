# Publishes unscoped `threejs-doctor` FIRST, then @threejs-doctor/*.
# Manual only (workflow_dispatch). Do not run scripts/publish.mjs --go outside
# this workflow — the script refuses unless GITHUB_ACTIONS=true.
# See docs/publish-checklist.md.
name: publish
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to release packages to npm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Confirm packed version
        run: node -e "console.log('publishing', require('./packages/cli/package.json').version)"
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish (unscoped first, then scoped) with provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # NPM_TOKEN can produce provenance attestations together with id-token: write.
          # Trusted Publisher lets you delete NPM_TOKEN later.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            unset NODE_AUTH_TOKEN
          fi
          node scripts/publish.mjs --go
      - name: Fail if published tarballs have empty provenance attestations
        # check-provenance.mjs retries npm view on E404 / empty attestations (~2–3 min)
        # while the registry finishes indexing a just-published version.
        run: node scripts/check-provenance.mjs --published
