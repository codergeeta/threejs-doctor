name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from root package.json packageManager (dual pin fails v4)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: threejs-doctor ci
        run: pnpm --filter @threejs-doctor/cli exec node ./bin/threejs-doctor.js ci --min-score 0
