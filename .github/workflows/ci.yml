name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version from root package.json packageManager (dual pin fails v4)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Rebuild the pasteable IIFE and fail if the committed dist drifted.
      - name: Verify committed live-attach IIFE
        run: pnpm check:iife
      - name: Smoke scan + ci --min-score gate
        run: |
          node packages/cli/bin/threejs-doctor.js scan packages/cli/src/__tests__/fixtures/healthy-static --profile marketing --budget low --format json
          node packages/cli/bin/threejs-doctor.js scan packages/cli/src/__tests__/fixtures/healthy-static --profile marketing --budget low --format html > /tmp/doctor-report.html
          grep -q 'static (source patterns)' /tmp/doctor-report.html
          node packages/cli/bin/threejs-doctor.js ci packages/cli/src/__tests__/fixtures/healthy-static --min-score 70 --profile marketing --budget low
          if node packages/cli/bin/threejs-doctor.js ci packages/cli/src/__tests__/fixtures/heavy-static --min-score 90 --profile marketing --budget low; then
            echo "expected heavy fixture to fail the min-score gate" >&2
            exit 1
          fi
      - name: Smoke report --example and unknown-key warning
        run: |
          node packages/cli/bin/threejs-doctor.js report --example > /tmp/s.json
          node packages/cli/bin/threejs-doctor.js report /tmp/s.json -o /tmp/s.html
          grep -q 'Before / after' /tmp/s.html
          grep -q 'Findings' /tmp/s.html
          grep -q 'Expensive meshes' /tmp/s.html
          grep -q 'GPU time per pass' /tmp/s.html
          grep -q 'Visuals' /tmp/s.html
          grep -q 'Score trend' /tmp/s.html
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/s.json","utf8")); j.historry=[]; fs.writeFileSync("/tmp/bad.json", JSON.stringify(j));'
          node packages/cli/bin/threejs-doctor.js report /tmp/bad.json -o /tmp/bad.html 2>/tmp/warn.txt
          grep -qi 'unrecognised' /tmp/warn.txt
          node scripts/build-sample-report.mjs /tmp/sample-site
          grep -q 'Sample fixture' /tmp/sample-site/sample-report.html
      # npm publish is documented in docs/publish-checklist.md and is not run here (no tokens).

  real-host-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Install Chromium (SwiftShader OK)
        run: pnpm --filter @threejs-doctor/real-host-e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
