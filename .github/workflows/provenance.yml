# Fail CI when the latest npm versions lack provenance attestations.
# Uses --latest so this job does not require the unpublished local version.
name: provenance
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
jobs:
  check-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Check latest npm dist.attestations
        run: node scripts/check-provenance.mjs --published --latest
